<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloudinary Test</title>
</head>
<body>

    <!-- 1. The Upload Button -->
    <button id="upload_widget" style="padding: 10px 20px; font-size: 16px; cursor: pointer;">
        Upload files
    </button>

    <!-- 2. The Photo Display Box -->
    <div id="photo-preview" style="margin-top: 20px;"></div>

    <!-- 3. Load Cloudinary's external script -->
    <script src="https://cloudinary.com" type="text/javascript"></script>  

    <!-- 4. The Magic Logic Script -->
    <script type="text/javascript">  
    try {
        var myWidget = cloudinary.createUploadWidget({
            cloudName: 'boswge8x',       
            uploadPreset: 'ml_default'   
        }, (error, result) => { 
            if (error) {
                alert("Cloudinary Configuration Error: " + error.message);
            }
            if (!error && result && result.event === "success") { 
                console.log('Done! Here is the image info: ', result.info); 
                
                var previewBox = document.getElementById("photo-preview");
                previewBox.innerHTML = ''; // Clear old images
                
                var newImage = document.createElement("img");
                newImage.src = result.info.secure_url;
                newImage.style.maxWidth = "300px";
                newImage.style.borderRadius = "8px";
                
                previewBox.appendChild(newImage);
            }
        });

        document.getElementById("upload_widget").addEventListener("click", function(e){
            e.preventDefault();
            myWidget.open();
        }, false);

    } catch (globalError) {
        // If there is a typo or code error, this alert will pop up automatically
        alert("JavaScript Failed to Load: " + globalError.message);
    }
    </script>

</body>
</html>
