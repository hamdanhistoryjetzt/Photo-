<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Live Photo Gallery</title>
    
    <!-- Load Core Framework Libraries -->
    <script src="https://cloudinary.com" type="text/javascript"></script>
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>
    
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; background-color: #f3f4f6; padding: 20px; }
        h1 { color: #1f2937; margin-bottom: 5px; }
        p { color: #4b5563; margin-bottom: 25px; }
        .upload-btn { background-color: #2563eb; color: white; border: none; padding: 14px 28px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: background 0.2s; }
        .upload-btn:hover { background-color: #1d4ed8; }
        
        #gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; width: 100%; max-width: 1200px; margin-top: 40px; }
        .gallery-card { background: white; padding: 10px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); text-align: center; }
        .gallery-card img { width: 100%; height: 200px; object-fit: cover; border-radius: 8px; }
        .timestamp { font-size: 12px; color: #9ca3af; margin-top: 8px; }
    </style>
</head>
<body>

    <h1>Public Photo Wall</h1>
    <p>Upload a photo to show it to everyone visiting this site instantly!</p>

    <!-- The Action Trigger Button -->
    <button id="upload_widget_btn" class="upload-btn">
        Upload Photo
    </button>

    <div id="gallery"></div>

    <!-- STEP 1: ISOLATED CLOUDINARY ENGINE RIGHT AT THE START -->
    <script type="text/javascript">
        var onUploadSuccessCallback = null;

        var actionButton = document.getElementById("upload_widget_btn");
        if (actionButton) {
            actionButton.addEventListener("click", function(event) {
                if (event) event.preventDefault();
                
                if (typeof cloudinary === 'undefined') {
                    alert("Cloudinary scripts are loading. Please wait 3 seconds and click again!");
                    return;
                }

                cloudinary.openUploadWidget({
                    cloudName: 'boswge8x',
                    uploadPreset: 'ml_default',
                    sources: ['local', 'camera'],
                    multiple: false,
                    resourceType: 'auto' // Smoothly accepts both photos and video media extensions
                }, function(error, result) {
                    // CRUCIAL: Only intercept genuine execution errors, ignore standard widget notification updates
                    if (error && !result) {
                        alert("Cloudinary Setup Error: " + error.message);
                        return;
                    }
                    
                    // Explicitly target the SUCCESS validation event to stop popup crashing loops
                    if (result && result.event === "success") {
                        console.log("Cloudinary Upload Success:", result.info.secure_url);
                        
                        // Hand off the URL payload to the database loop below
                        if (typeof onUploadSuccessCallback === "function") {
                            onUploadSuccessCallback(result.info.secure_url);
                        }
                    }
                });
            });
        }
    </script>

    <!-- STEP 2: DATABASE DATA PIPELINE RUNS INDEPENDENTLY BELOW -->
    <script type="text/javascript">
        const firebaseConfig = {
            apiKey: "AIzaSyBbxQJFi3UKNv80y2a-_adfutjIqVq8A2w",
            authDomain: "://firebaseapp.com",
            databaseURL: "https://firebasedatabase.app",
            projectId: "my-photo-gallery-40bc",
            storageBucket: "my-photo-gallery-40bc3.firebasestorage.app",
            messagingSenderId: "861309146437",
            appId: "1:861309146437:web:2d26303d34e98170811a2"
        };

        // Connect to your European Database Room
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const photosRef = database.ref('public_photos');

        // Watch for photo links and render the shared grid wall
        photosRef.on('value', function(snapshot) {
            const galleryContainer = document.getElementById("gallery");
            galleryContainer.innerHTML = ""; 
            
            const data = snapshot.val();
            if (data) {
                Object.keys(data).reverse().forEach(function(key) {
                    var record = data[key];
                    
                    var card = document.createElement("div");
                    card.className = "gallery-card";
                    
                    var img = document.createElement("img");
                    img.src = record.url;
                    
                    var timeLabel = document.createElement("div");
                    timeLabel.className = "timestamp";
                    timeLabel.innerText = new Date(record.timestamp).toLocaleDateString();
                    
                    card.appendChild(img);
                    card.appendChild(timeLabel);
                    galleryContainer.appendChild(card);
                });
            }
        });

        // This function handles the incoming link from Cloudinary securely
        onUploadSuccessCallback = function(url) {
            photosRef.push({
                url: url,
                timestamp: Date.now()
            });
        };
    </script>

</body>
</html>
