<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serverless Direct Upload</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
        }
        #upload-btn {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        #upload-btn:hover {
            background-color: #2563eb;
        }
        #preview-container {
            margin-top: 30px;
            max-width: 90%;
            text-align: center;
        }
        img, video {
            max-width: 100%;
            max-height: 400px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <button id="upload-btn">Upload Photo or Video</button>
    <div id="preview-container"></div>

    <!-- Load the Cloudinary Widget Script -->
    <script src="https://cloudinary.com" type="text/javascript"></script>

    <script type="text/javascript">
        // Updated account settings
        const CLOUD_NAME = "boswge8x"; 
        const UPLOAD_PRESET = "ml_default"; // <-- Updated to your new preset name

        const uploadButton = document.getElementById("upload-btn");
        const previewContainer = document.getElementById("preview-container");

        const myWidget = cloudinary.createUploadWidget({
            cloudName: CLOUD_NAME,
            uploadPreset: UPLOAD_PRESET,
            sources: ['local', 'camera'],
            multiple: false, 
            maxFileSize: 50000000, // 50MB limit
            clientAllowedFormats: ["png", "jpeg", "jpg", "mp4", "mov"]
        }, (error, result) => {
            if (error) {
                alert("Cloudinary Error: " + error.message);
                console.error(error);
            }
            
            if (!error && result && result.event === "success") {
                console.log('Done! Here is the file info: ', result.info);
                previewContainer.innerHTML = '';

                // Show the file instantly on screen
                if (result.info.resource_type === "image") {
                    const img = document.createElement("img");
                    img.src = result.info.secure_url;
                    previewContainer.appendChild(img);
                } else if (result.info.resource_type === "video") {
                    const video = document.createElement("video");
                    video.src = result.info.secure_url;
                    video.controls = true;
                    previewContainer.appendChild(video);
                }
            }
        });

        uploadButton.addEventListener("click", function(event) {
            event.preventDefault(); 
            try {
                myWidget.open();
            } catch(err) {
                alert("JavaScript Error trying to open widget: " + err.message);
            }
        }, false);
    </script>
</body>
</html>
