<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloudinary Dynamic Upload Portal</title>
    <!-- We load the official Cloudinary library globally right in the header -->
    <script src="https://upload-widget.cloudinary.com/latest/global/all.js" type="text/javascript"></script>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; background-color: #fafafa; }
        .upload-btn { background-color: #2563eb; color: white; border: none; padding: 14px 28px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .upload-btn:hover { background-color: #1d4ed8; }
        #preview { margin-top: 24px; text-align: center; }
        #preview img { max-width: 90%; max-height: 400px; border-radius: 12px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

    <!-- The operational upload element -->
    <button class="upload-btn" onclick="launchCloudinaryWidget(event)">
        Upload files
    </button>

    <!-- The target display layer for your images -->
    <div id="preview"></div>

    <script type="text/javascript">
        // Direct global function initialization to defeat scoping bugs
        function launchCloudinaryWidget(event) {
            if (event) event.preventDefault();
            
            try {
                // Ensure the external library script has completely processed
                if (typeof cloudinary === 'undefined') {
                    alert("System Critical: The Cloudinary global network script hasn't loaded yet. Please check your internet connection and refresh.");
                    return;
                }

                // Initialize and immediately execute the window layer concurrently
                var checkoutWidget = cloudinary.openUploadWidget({
                    cloudName: 'boswge8x',
                    uploadPreset: 'ml_default',
                    sources: ['local', 'camera'],
                    multiple: false
                }, function(error, result) {
                    if (error) {
                        alert("Cloudinary Connection Issue: " + error.message);
                        console.error("Cloudinary error payload:", error);
                        return;
                    }
                    
                    // Intercept the valid upload event callback frame
                    if (result && result.event === "success") {
                        console.log("Upload resolved successfully. Details:", result.info);
                        
                        var targetContainer = document.getElementById("preview");
                        targetContainer.innerHTML = ""; // Purge stale preview objects
                        
                        var imageDOMNode = document.createElement("img");
                        imageDOMNode.src = result.info.secure_url;
                        targetContainer.appendChild(imageDOMNode);
                    }
                });
            } catch (runtimeError) {
                alert("Runtime Exception: " + runtimeError.message);
            }
        }
    </script>

</body>
</html>
